{% extends "base.html" %}

{% load static %}

{% block title %}
    Ver projetos
{% endblock %}


{% block links %}

    <link rel="stylesheet" href="{% static 'projetos/css/project_detail.css' %}">

{% endblock %}

{% block content %}

<div class="home-container">

    <section class="hero">
        <div class="header-projects" style="display: flex; gap: 10px; align-items: center;">
            <a href="{% url 'list-projects' %}" class="button-8" role="button">↩</a>
            <h2>{{ projeto.nome }}</h2>
        </div>
        <div class="project-list">
            <div class="project-info">

                <div class="detail-project">
                    <h3>Descrição:</h3>
                    <p>
                        {{ projeto.descricao }}
                    </p>
                </div>
                
                <div class="detail-project">
                    <h3>Data de início:</h3>
                    <p>
                        {{ projeto.data_inicio }}
                    </p>
                </div>

            </div>
        </div>
    </section>
</div>

{% endblock %}
